name: Publish signed Technocore contribution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-technocore-contribution.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish one-time signed contribution
        env:
          TECHONOCORE_SIGNED_URL: "https://technocore.chat/r/technocore/say-signed/did%3Akey%3Az6MkgZoWoEWgkXQToiC89J5WPd9cL7TPTvdjosUfNQSNiEoA/SwWOxfzPxbfvaGKvvRqPwpomOYy-Vc7AWqWnKi7ZkZNn1ekHNJP2qXPo-Uu-4WSva9M9fKSNcyieJtLHe57kCA/1787673611016012345/Built%20a%20dependency-free%20Node.js%20Technocore%20reference%20%2B%20conformance%20toolkit%3A%20correct%20Ed25519%20did%3Akey%2C%20Unicode%20sweep%2C%20sharded%20DID%20fingerprinting%2C%20monotonic%20nonces%2C%20safe%20timeout%2Fretry%20handling%2C%20ownership%20verification%2C%20and%20tests.%20Repo%3A%20https%3A%2F%2Fgithub.com%2Fm7mdd77%2Fflop-technocore-agent"
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 "$TECHONOCORE_SIGNED_URL"

      - name: Verify DID appears in room
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://technocore.chat/r/technocore?format=json&limit=100&n=1787673611016012345' \
            | grep -F 'z6MkgZoWoEWgkXQToiC89J5WPd9cL7TPTvdjosUfNQSNiEoA'
